name: TypeScript baseline codemod

on:
  push:
    branches:
      - fix/typescript-baseline

permissions:
  contents: write

jobs:
  codemod:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typescript-baseline

      - name: Apply targeted TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []

          def patch(path_str, replacements):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  if old not in updated:
                      raise SystemExit(f'Expected text not found in {path_str}: {old[:120]!r}')
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path_str)

          patch('app/abitanti.tsx', [
              ('''    <View\n      style={styles.tooltipWrap}\n      onMouseEnter={() => setShow(true)}\n      onMouseLeave={() => setShow(false)}\n    >\n      <Text style={styles.cellEmojiText}>{emoji}</Text>\n      {show && (\n        <View style={styles.tooltipBox}>\n          <Text style={styles.tooltipText}>{nome}</Text>\n        </View>\n      )}\n    </View>''', '''    <Pressable\n      style={styles.tooltipWrap}\n      onHoverIn={() => setShow(true)}\n      onHoverOut={() => setShow(false)}\n    >\n      <Text style={styles.cellEmojiText}>{emoji}</Text>\n      {show && (\n        <View style={styles.tooltipBox}>\n          <Text style={styles.tooltipText}>{nome}</Text>\n        </View>\n      )}\n    </Pressable>''')
          ])

          patch('app/felicita.tsx', [
              ('{abitante.nome} {abitante.cognome}', '{abitante.nome}')
          ])

          patch('app/mappa.tsx', [
              ('Platform.select<ViewStyle>({', 'Platform.select<any>({'),
              ('<View style={[styles.gridTerrain, gridContainerStyle]}>', '<View style={[styles.gridTerrain, gridContainerStyle as ViewStyle]}>'),
              ('    boxSizing: "border-box"\n', '')
          ])

          patch('src/components/MapWandererCharacter.tsx', [
              ('commutePurpose?: "work" | "bar" | "home" | "mensa" | "culto" | "negozio" | "rapina" | null;',
               'commutePurpose?: "work" | "bar" | "home" | "mensa" | "culto" | "negozio" | "rapina" | "cerca_lavoro" | null;')
          ])

          patch('src/ui/LuogoCultoFullscreenModal.tsx', [
              ('purpose: "work" | "bar" | "home" | "mensa" | "culto" | "negozio" | "rapina";',
               'purpose: "work" | "bar" | "home" | "mensa" | "culto" | "negozio" | "rapina" | "cerca_lavoro";')
          ])

          patch('src/ui/CapannaFullscreenModal.tsx', [
              ('type CommuteEntry = {\n  purpose: "work" | "bar" | "home";\n};',
               'type CommuteEntry = {\n  purpose: "work" | "bar" | "home" | "mensa" | "culto" | "negozio" | "rapina" | "cerca_lavoro";\n};'),
              ('const commuteInfo = commuteRaw ? { purpose: commuteRaw.purpose } : undefined;',
               'const commuteInfo =\n        commuteRaw &&\n        (commuteRaw.purpose === "work" || commuteRaw.purpose === "bar" || commuteRaw.purpose === "home")\n          ? { purpose: commuteRaw.purpose }\n          : undefined;')
          ])

          patch('app/religione.tsx', [
              ('''  politicaTitoloInline: {\n    color: "#e5e7eb",\n    fontSize: 8,\n    fontWeight: "700",\n    textAlign: "center",\n    marginBottom: 2\n  },''', '''  politicaTitoloInline: {\n    color: "#e5e7eb",\n    fontSize: 8,\n    fontWeight: "700",\n    textAlign: "center",\n    marginBottom: 2\n  },\n  politicaTitoloSelected: {\n    color: "#ffffff"\n  },''')
          ])

          for renderer in [
              'src/components/BuildingRenderer.tsx',
              'src/components/CharacterRenderer.tsx',
              'src/components/GridRenderer.tsx'
          ]:
              path = Path(renderer)
              text = path.read_text(encoding='utf-8')
              updated = text
              for line in [
                  '    WebkitUserSelect: "none",\n',
                  '    MozUserSelect: "none",\n',
                  '    msUserSelect: "none"\n',
                  '    WebkitUserSelect: "none"\n'
              ]:
                  updated = updated.replace(line, '')
              # Repair dangling comma after userSelect when the removed vendor property was last.
              updated = updated.replace('    userSelect: "none",\n  },', '    userSelect: "none"\n  },')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(renderer)

          patch('src/components/MapTerrainCell.tsx', [
              ('Platform.select<ViewStyle>({', 'Platform.select<any>({'),
              ('      pointerEvents="none"\n', ''),
              ('''  cellaFixed: {\n    boxSizing: "border-box"\n  },''', '''  cellaFixed: {},''')
          ])

          patch('src/components/MapWaterCellsLayer.tsx', [
              ('Platform.select<ViewStyle>({', 'Platform.select<any>({'),
              ('''  cellaFixed: {\n\n    boxSizing: "border-box"\n\n  }''', '''  cellaFixed: {}''')
          ])

          patch('src/game/overworldSpritesheetLayout.ts', [
              ('if (score > bestScore) {\n      bestScore = score;\n      bestCoord = coord;\n    }',
               'if (coord != null && score > bestScore) {\n      bestScore = score;\n      bestCoord = coord;\n    }')
          ])

          patch('src/game/terrainSpriteHelpers.ts', [
              ('''  if (allowed == null || allowed.size === 0) {\n    return clampSpiaggiaAssetToWaterNeighbors(index, cols, rows, terrenoInMappa, asset);\n  }\n  const waterOk = filterSpiaggiaByWaterMask(allowed, index, cols, rows, terrenoInMappa);''', '''  const resolvedAllowed = allowed as Set<SpiaggiaTileAsset1x1> | null;\n  if (resolvedAllowed == null || resolvedAllowed.size === 0) {\n    return clampSpiaggiaAssetToWaterNeighbors(index, cols, rows, terrenoInMappa, asset);\n  }\n  const waterOk = filterSpiaggiaByWaterMask(resolvedAllowed, index, cols, rows, terrenoInMappa);''')
          ])

          patch('src/ui/CampoDiLavoroModal.tsx', [
              ('''  sectionLabel: {\n    color: "#93c5fd",\n    fontSize: 12,\n    fontWeight: "600",\n    marginBottom: 8,\n    textTransform: "uppercase",\n    letterSpacing: 0.5\n  },''', '''  sectionLabel: {\n    color: "#93c5fd",\n    fontSize: 12,\n    fontWeight: "600",\n    marginBottom: 8,\n    textTransform: "uppercase",\n    letterSpacing: 0.5\n  },\n  line: {\n    color: "rgba(203,213,245,0.85)",\n    fontSize: 13,\n    lineHeight: 19\n  },''')
          ])

          print(f'Updated {len(changed)} files')
          for path in changed:
              print(path)
          PY

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app src
          git commit -m "fix: resolve remaining TypeScript baseline errors"
          git push origin HEAD:fix/typescript-baseline
