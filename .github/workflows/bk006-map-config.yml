name: BK006 map config extraction

on:
  push:
    branches:
      - refactor/map-config-bk006

permissions:
  contents: write

jobs:
  codemod:
    if: ${{ !contains(github.event.head_commit.message, '[bk006-codemod]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/map-config-bk006
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract local map config references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/mappa.tsx')
          text = path.read_text()

          anchor = '} from "../src/game/terrainSpriteHelpers";\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one terrainSpriteHelpers import anchor, found {text.count(anchor)}')

          import_block = '''import {
            ADMIN_FOOTPRINT_H,
            ADMIN_FOOTPRINT_W,
            BAR_FOOTPRINT_H,
            BAR_FOOTPRINT_W,
            CAPANNA_FOOTPRINT_H,
            CAPANNA_FOOTPRINT_W,
            CELL_SIZE_PX,
            COSTRUZIONE_TERRENO_FOOTPRINT_H,
            COSTRUZIONE_TERRENO_FOOTPRINT_W,
            DISSALATORE_FOOTPRINT_H,
            DISSALATORE_FOOTPRINT_W,
            DOPPIO_TAP_MS,
            DORMITORIO_FOOTPRINT_H,
            DORMITORIO_FOOTPRINT_W,
            FIXED_MAP_COLS,
            FIXED_MAP_ROWS,
            GAP,
            MERCATO_FOOTPRINT_H,
            MERCATO_FOOTPRINT_W,
            NEGOZIO_FOOTPRINT_H,
            NEGOZIO_FOOTPRINT_W,
            SERRA_FOOTPRINT_H,
            SERRA_FOOTPRINT_W,
            SPAZIOPORTO_FOOTPRINT_H,
            SPAZIOPORTO_FOOTPRINT_W,
            TRIBUNALE_FOOTPRINT_H,
            TRIBUNALE_FOOTPRINT_W,
            UFFICIO_EDILE_FOOTPRINT_H,
            UFFICIO_EDILE_FOOTPRINT_W,
            UFFICIO_IMMIGRAZIONE_FOOTPRINT_H,
            UFFICIO_IMMIGRAZIONE_FOOTPRINT_W,
            getIndiciEdificiIniziali
          } from "../src/game/mappaLayoutConfig";\n'''
          text = text.replace(anchor, anchor + import_block, 1)

          config_pattern = re.compile(
              r'/\*\* Dimensione fissa della mappa: non dipende dal viewport\. Stabilita una sola volta all\'avvio\. \*/\n'
              r'const FIXED_MAP_COLS = 50;\n'
              r'.*?'
              r'/\*\* Gap tra le celle \(0 = griglia compatta 2000x2000\)\. \*/\n'
              r'const GAP = 0;\n',
              re.S,
          )
          text, n = config_pattern.subn('', text, count=1)
          if n != 1:
              raise SystemExit(f'Expected one static config block, replaced {n}')

          text, n = re.subn(r'const DOPPIO_TAP_MS = 400;\n', '', text, count=1)
          if n != 1:
              raise SystemExit(f'Expected one DOPPIO_TAP_MS declaration, replaced {n}')

          indices_pattern = re.compile(
              r'/\*\* Calcola indici edifici iniziali in funzione di cols/rows \(centro griglia\)\. \*/\n'
              r'function getIndiciEdificiIniziali\(cols: number, rows: number\) \{.*?\n\}\n',
              re.S,
          )
          text, n = indices_pattern.subn('', text, count=1)
          if n != 1:
              raise SystemExit(f'Expected one getIndiciEdificiIniziali function, replaced {n}')

          forbidden = [
              'const FIXED_MAP_COLS =',
              'const ADMIN_FOOTPRINT_W =',
              'const CELL_SIZE_PX =',
              'const DOPPIO_TAP_MS =',
              'function getIndiciEdificiIniziali('
          ]
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'Local declaration still present: {item}')

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Commit refactor
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mappa.tsx src/game/mappaLayoutConfig.ts tests/map-layout-config.test.ts
          git commit -m "refactor: use extracted map layout config [bk006-codemod]"
          git push origin HEAD:refactor/map-config-bk006
