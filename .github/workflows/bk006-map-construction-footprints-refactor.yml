name: BK-006 construction footprints refactor

on:
  push:
    branches:
      - refactor/map-construction-footprints-bk006

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/map-construction-footprints-bk006
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow construction footprints extraction
        run: python3 scripts/bk006-construction-footprints.py

      - name: Diff sanity
        run: |
          git diff --check
          git diff -- app/mappa.tsx src/game/mappaCostruzioneFootprints.ts tests/mappa-costruzione-footprints.test.ts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Commit refactor and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/bk006-map-construction-footprints-refactor.yml
          rm scripts/bk006-construction-footprints.py
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git add -A
          git commit -m "Extract map construction footprints

Continue BK-006 by moving only FOOTPRINT_COSTRUZIONE out of app/mappa.tsx with regression tests. [bk006-construction-footprints-applied]"
          git push origin HEAD:refactor/map-construction-footprints-bk006
