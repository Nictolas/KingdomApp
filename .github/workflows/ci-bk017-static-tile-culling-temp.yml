name: BK017 Static Tile Culling Codemod

on:
  push:
    branches:
      - perf/bk017-static-tile-viewport-culling

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bk017-static-tile-viewport-culling
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch KingdomMapScene
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          p = Path("src/phaser/scenes/KingdomMapScene.ts")
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f"{label} marker not found")
              s = s.replace(old, new, 1)

          replace_once(
              'import { isPointNearPhaserWorldView } from "../adapters/phaserViewportCulling";',
              dedent('''\
              import {
                computePhaserWorldViewCellRange,
                isCellInsidePhaserGridRange,
                isPointNearPhaserWorldView,
                phaserGridCellRangesEqual,
                type PhaserGridCellRange
              } from "../adapters/phaserViewportCulling";'''),
              "import"
          )

          old_character_type = dedent('''\
          type CharacterView = {
            root: Phaser.GameObjects.Container;
            sprite: Phaser.GameObjects.Sprite;
            token: number;
            direction: 0 | 1 | 2 | 3;
          };''')
          new_character_type = old_character_type + dedent('''\

          type StaticTileView = {
            object: Phaser.GameObjects.Image;
            cell: number;
          };''')
          replace_once(old_character_type, new_character_type, "static tile type")

          replace_once(
              "  private renderedSnapshot: PhaserMapSnapshot | null = null;\n  private waterSprites: Phaser.GameObjects.Image[] = [];",
              "  private renderedSnapshot: PhaserMapSnapshot | null = null;\n  private staticTileViews: StaticTileView[] = [];\n  private lastStaticTileRange: PhaserGridCellRange | null = null;\n  private staticTileVisibilityDirty = true;\n  private waterSprites: Phaser.GameObjects.Image[] = [];",
              "static tile fields"
          )

          replace_once(
              "    this.tileLayer.removeAll(true);\n    this.waterSprites = [];\n    this.waterViewportDirty = true;",
              "    this.tileLayer.removeAll(true);\n    this.staticTileViews = [];\n    this.lastStaticTileRange = null;\n    this.staticTileVisibilityDirty = true;\n    this.waterSprites = [];\n    this.waterViewportDirty = true;",
              "snapshot reset"
          )

          replace_once(
              "      this.tileLayer.add(sprite);\n      if (tile.animation === \"water\") this.waterSprites.push(sprite);",
              "      this.tileLayer.add(sprite);\n      this.staticTileViews.push({ object: sprite, cell: tile.index });\n      if (tile.animation === \"water\") this.waterSprites.push(sprite);",
              "base tile registration"
          )

          replace_once(
              "        this.tileLayer.add(overlay);\n      }\n    }",
              "        this.tileLayer.add(overlay);\n        this.staticTileViews.push({ object: overlay, cell: tile.index });\n      }\n    }",
              "overlay registration"
          )

          replace_once(
              "    this.cameras.main.setBounds(0, 0, worldW, worldH);\n    this.physics?.world?.setBounds(0, 0, worldW, worldH);\n    this.renderedRevision = snapshot.revision;",
              "    this.cameras.main.setBounds(0, 0, worldW, worldH);\n    this.physics?.world?.setBounds(0, 0, worldW, worldH);\n    this.refreshStaticTileVisibility(true);\n    this.renderedRevision = snapshot.revision;",
              "initial tile visibility"
          )

          replace_once(
              "  update(time: number): void {\n    if (this.characterVisibilityDirty || time >= this.nextCharacterVisibilityAt) {",
              "  update(time: number): void {\n    if (this.staticTileVisibilityDirty) this.refreshStaticTileVisibility();\n\n    if (this.characterVisibilityDirty || time >= this.nextCharacterVisibilityAt) {",
              "update tile visibility"
          )

          refresh_method = dedent('''\
            private refreshStaticTileVisibility(force = false): void {
              if (this.staticTileViews.length === 0) {
                this.staticTileVisibilityDirty = false;
                return;
              }
              const snapshot = this.bridge.getSnapshot();
              const camera = this.cameras.main;
              const worldView = {
                x: camera.worldView.x,
                y: camera.worldView.y,
                width: camera.worldView.width,
                height: camera.worldView.height
              };
              const range = computePhaserWorldViewCellRange(
                worldView,
                snapshot.cols,
                snapshot.rows,
                snapshot.cellSize,
                2
              );
              this.staticTileVisibilityDirty = false;
              if (!force && phaserGridCellRangesEqual(this.lastStaticTileRange, range)) return;
              this.lastStaticTileRange = range;

              for (const tileView of this.staticTileViews) {
                const visible = isCellInsidePhaserGridRange(tileView.cell, snapshot.cols, range);
                if (tileView.object.visible !== visible) tileView.object.setVisible(visible);
              }
            }

          ''')
          if "private refreshStaticTileVisibility(" not in s:
              marker = "  private refreshVisibleWaterFrames(): void {"
              if marker not in s:
                  raise SystemExit("refresh method insertion marker not found")
              s = s.replace(marker, refresh_method + marker, 1)

          pan_old = "      this.characterVisibilityDirty = true;\n      this.waterViewportDirty = true;"
          pan_new = pan_old + "\n      this.staticTileVisibilityDirty = true;"
          if "      this.staticTileVisibilityDirty = true;" not in s[s.find("this.input.on(\"pointermove\""):s.find("this.input.on(\"pointerout\"")]:
              replace_once(pan_old, pan_new, "pan dirty flag")

          wheel_start = s.find('    this.input.on(\n      "wheel"')
          wheel_end = s.find("    );", wheel_start)
          wheel_block = s[wheel_start:wheel_end] if wheel_start >= 0 and wheel_end >= 0 else ""
          if "this.staticTileVisibilityDirty = true;" not in wheel_block:
              wheel_old = "        this.characterVisibilityDirty = true;\n        this.waterViewportDirty = true;"
              wheel_new = wheel_old + "\n        this.staticTileVisibilityDirty = true;"
              if wheel_old not in s:
                  raise SystemExit("zoom dirty flag marker not found")
              # Replace the last occurrence so pointermove remains untouched.
              idx = s.rfind(wheel_old)
              s = s[:idx] + wheel_new + s[idx + len(wheel_old):]

          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/phaser/scenes/KingdomMapScene.ts
          git diff --cached --quiet && exit 0
          git commit -m "BK-017: cull static Phaser tiles by viewport"
          git push origin HEAD:perf/bk017-static-tile-viewport-culling
