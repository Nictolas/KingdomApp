name: BK-006 footprint anchor search

on:
  push:
    branches:
      - refactor/map-footprint-anchor-search-bk006

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow extraction
        run: node scripts/bk006-extract-footprint-anchor-search.mjs
      - name: Remove temporary files
        run: rm scripts/bk006-extract-footprint-anchor-search.mjs .github/workflows/bk006-footprint-anchor-search.yml
      - name: Diff sanity
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main | sort)"
          expected="$(printf '%s\n' app/mappa.tsx src/game/mappaPiazzamentoFootprint.ts tests/mappa-piazzamento-footprint.test.ts | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Phaser tests
        run: npm run test:phaser
      - name: Build web
        run: npm run build:web
      - name: Commit refactor and remove temporary files
        run: |
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git add -A
          git commit -m "Extract footprint anchor search helpers" -m "Continue BK-006 by moving trovaAnchorFootprintLibero and trovaCellaSingolaConCuscino out of app/mappa.tsx with deterministic tests. No building writers, gameplay, or rendering changes. [bk006-final]"
          git push origin HEAD:refactor/map-footprint-anchor-search-bk006
