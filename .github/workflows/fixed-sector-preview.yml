name: Fixed Sector Preview
on:
  pull_request:
    paths:
      - "app/settori-preview.tsx"
      - "src/game/sectorPreviewModel.ts"
      - "tests/sector-preview.test.ts"
      - "tests/sector-preview-browser.mjs"
      - "tests/sector-preview-static-server.mjs"
      - "tests/sector-preview-static-server.test.mjs"
      - "docs/FIXED_SECTOR_PREVIEW.md"
      - "tsconfig.sector-preview.json"
      - ".github/workflows/fixed-sector-preview.yml"
  workflow_dispatch:
jobs:
  preview-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck isolated preview
        run: npx tsc --project tsconfig.sector-preview.json --noEmit
      - name: Validate sector model
        run: npx tsx --test tests/sector-preview.test.ts
      - name: Validate Expo export route resolution
        run: node --test tests/sector-preview-static-server.test.mjs
      - name: Export web bundle
        run: npx expo export --platform web --output-dir /tmp/fixed-sector-preview-web
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/fixed-sector-preview-android
      - name: Export iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir /tmp/fixed-sector-preview-ios

  browser-rendered-preview:
    # Playwright 1.55 supports Ubuntu 24.04, not the ubuntu-26.04 runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      PREVIEW_SCREENSHOT_DIR: /tmp/fixed-sector-preview-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Export web for rendered UI checks
        run: npx expo export --platform web --output-dir /tmp/fixed-sector-preview-browser-web
      - name: Inspect exported HTML entry points
        run: |
          find /tmp/fixed-sector-preview-browser-web -maxdepth 3 -name '*.html' -print | head -40
          node --input-type=module -e "import { findStaticPreviewFile } from './tests/sector-preview-static-server.mjs'; const file = await findStaticPreviewFile('/tmp/fixed-sector-preview-browser-web', '/settori-preview', { allowSpaFallback: false }); console.log(file ? 'Dedicated exported preview HTML: ' + file : 'SPA-only export: no route-specific HTML; browser UI will be tested using Expo Router dev server')"
      - name: Install isolated Chromium tooling (CI only)
        run: |
          npm install --prefix /tmp/fixed-sector-browser-tools --no-save --no-package-lock playwright@1.55.0
          /tmp/fixed-sector-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Start Expo Router dev server for route-aware browser tests
        run: |
          nohup npx expo start --web --port 8081 --host localhost > /tmp/fixed-sector-expo.log 2>&1 &
          echo $! > /tmp/fixed-sector-expo.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8081/settori-preview -o /tmp/fixed-sector-route.html; then
              echo "Expo Router server is accepting preview requests"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/fixed-sector-expo.pid)" 2>/dev/null; then
              tail -n 100 /tmp/fixed-sector-expo.log
              exit 1
            fi
            sleep 2
          done
          tail -n 100 /tmp/fixed-sector-expo.log
          exit 1
      - name: Validate real DOM layout, navigation and capture responsive screenshots
        env:
          PREVIEW_PLAYWRIGHT_MODULE: /tmp/fixed-sector-browser-tools/node_modules/playwright
        run: node tests/sector-preview-browser.mjs http://127.0.0.1:8081
      - name: Print Expo Router server diagnostics on failure
        if: failure()
        run: tail -n 150 /tmp/fixed-sector-expo.log || true
      - name: Preserve browser screenshots (not physical-device evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-sector-preview-browser-screenshots
          path: /tmp/fixed-sector-preview-screenshots
          if-no-files-found: ignore
