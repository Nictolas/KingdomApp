name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Apply BK-006 desalination codemod
        if: github.event_name == 'pull_request' && github.head_ref == 'refactor/map-desalination-placement-bk006'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/mappa.tsx')
          text = path.read_text(encoding='utf-8')
          import_anchor = '''import {
  estendiVietatoConFootprintECuscino,
  puòPiazzareFootprintConCuscino,
  scegliAnchorComplessoAmministrativo,
  trovaAnchorFootprintLibero,
  trovaCellaSingolaConCuscino,
  vietatoFootprintECuscinoDaEdificiIniziali
} from "../src/game/mappaPiazzamentoFootprint";
'''
          new_import = '''import {
  footprintDissalatoreMareSabbiaValido,
  trovaAnchorDissalatore
} from "../src/game/mappaDissalatorePiazzamento";
'''
          start = text.find('/** Sabbia = terreno sabbia su terraferma (non mare). */')
          end_marker = '/** Mare, fiume, sabbia o confine con acqua: nessuna cella strada (vedi {@link isCellaOkPerStrada}). */'
          end = text.find(end_marker)

          changed = False
          if new_import not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('Import anchor non univoco')
              text = text.replace(import_anchor, import_anchor + new_import, 1)
              changed = True
          if start != -1:
              if end == -1 or end <= start:
                  raise SystemExit('Fine blocco Dissalatore non trovata')
              text = text[:start] + text[end:]
              changed = True
          if changed:
              path.write_text(text, encoding='utf-8')
          PY

          if ! git diff --quiet -- app/mappa.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/mappa.tsx
            git commit -m "BK-006: use extracted desalination placement helpers"
            git push origin HEAD:refactor/map-desalination-placement-bk006
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web
