name: BK-006 map building grid helpers

on:
  push:
    branches:
      - refactor/map-building-grid-helpers-bk006

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow building-grid helper extraction
        run: python3 .github/scripts/bk006_map_building_grid_helpers.py

      - name: Diff sanity
        shell: bash
        run: |
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' app/mappa.tsx src/game/mappaEdificioFootprints.ts tests/mappa-edificio-footprints.test.ts | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Commit refactor and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/bk006-map-building-grid-helpers.yml
          rm .github/scripts/bk006_map_building_grid_helpers.py
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git add -A
          git commit -m "Extract map building grid helpers" -m "Continue BK-006 by moving pure building-grid helpers out of app/mappa.tsx with regression tests. No placement, gameplay, or rendering changes."
          git push origin HEAD:refactor/map-building-grid-helpers-bk006
