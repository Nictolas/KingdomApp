name: LPC pixel-art HD pilot
on:
  pull_request:
    branches: [ui/compact-castle-dashboard]
    types: [opened, synchronize]
    paths:
      - scripts/build_lpc_hd_pilot.py
      - .github/workflows/lpc-hd-pilot.yml
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate four prototype sprite sheets and visual comparison
        run: python scripts/build_lpc_hd_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: mykingdom-lpc-hd-pilot
          path: assets/character-packs/lpc/hd-pilot/
      - name: Preserve results on isolated draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/character-packs/lpc/hd-pilot
          if ! git diff --cached --quiet; then
            git commit -m "art(mykingdom): generate LPC HD body/head pilot [skip ci]"
            git push
          fi
