name: BK-049 Expo SDK 54

on:
  push:
    branches:
      - upgrade/expo-sdk-bk049

permissions:
  contents: write

jobs:
  upgrade-sdk54:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      NPM_CONFIG_LEGACY_PEER_DEPS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: upgrade/expo-sdk-bk049

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install SDK 53 baseline
        run: npm ci

      - name: Upgrade Expo to SDK 54
        run: npm install expo@^54.0.0

      - name: Align dependencies with SDK 54
        run: npx expo install --fix --npm

      - name: Install Expo Router required peer
        run: npx expo install expo-linking --npm

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Audit dependencies
        shell: bash
        run: |
          npm audit --json > npm-audit-sdk54.json || true
          npm audit > npm-audit-sdk54.txt || true

      - name: Commit SDK 54 upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git commit -m "chore: upgrade Expo SDK 53 to 54"
          git push origin HEAD:upgrade/expo-sdk-bk049
