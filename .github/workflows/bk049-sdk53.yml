name: BK-049 Expo SDK 57

on:
  push:
    branches:
      - upgrade/expo-sdk-bk049

permissions:
  contents: write

jobs:
  upgrade-sdk57:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      NPM_CONFIG_LEGACY_PEER_DEPS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: upgrade/expo-sdk-bk049

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install SDK 55 baseline
        run: npm ci

      - name: Upgrade Expo to fixed SDK 57 line
        run: npm install expo@^57.0.9

      - name: Align dependencies with SDK 57
        run: npx expo install --fix --npm

      - name: Install required native peers
        run: npx expo install expo-linking react-native-worklets --npm

      - name: Apply SDK 57 source compatibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          fill = 'position: "absolute",\n    top: 0,\n    right: 0,\n    bottom: 0,\n    left: 0'

          for filename, expected in [
              ("app/mappa.tsx", 1),
              ("src/components/RpgFootprintBuilding.tsx", 2),
          ]:
              path = Path(filename)
              text = path.read_text()
              count = text.count("...StyleSheet.absoluteFillObject")
              if count != expected:
                  raise SystemExit(f"{filename}: expected {expected} absoluteFillObject usages, found {count}")
              path.write_text(text.replace("...StyleSheet.absoluteFillObject", fill))

          path = Path("src/navigation/apriResidenzaMappa.ts")
          text = path.read_text()
          old = 'import type { Router } from "expo-router";'
          new = 'import type { useRouter } from "expo-router";\ntype Router = ReturnType<typeof useRouter>;'
          if text.count(old) != 1:
              raise SystemExit("Expected one Expo Router type import to migrate")
          path.write_text(text.replace(old, new))
          PY

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Audit dependencies
        shell: bash
        run: |
          npm audit --json > npm-audit-sdk57.json || true
          npm audit > npm-audit-sdk57.txt || true
          cat npm-audit-sdk57.txt

      - name: Commit SDK 57 upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app.json app/mappa.tsx src/components/RpgFootprintBuilding.tsx src/navigation/apriResidenzaMappa.ts
          if git diff --cached --quiet; then
            echo "No upgrade changes"
            exit 0
          fi
          git commit -m "chore: upgrade Expo SDK 55 to 57"
          git push origin HEAD:upgrade/expo-sdk-bk049
