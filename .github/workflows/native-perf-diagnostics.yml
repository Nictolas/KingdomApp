      - "src/performance/nativeResidentFrameLifecycle.native.ts"
      - "src/performance/nativeResidentActivityGate.ts"
      - "tests/native-resident-activity-gate.test.ts"
      - "tests/native-resident-lifecycle-integration.test.ts"
      - "tests/native-resident-lifecycle-bootstrap.test.ts"
      - "tests/native-real-sprite-ab-comparison.test.ts"
      - "tests/native-real-sprite-ab-replicates.test.ts"
      - "tests/native-resident-route-transitions.test.ts"
      - "tests/native-resident-collision-retry.test.ts"
