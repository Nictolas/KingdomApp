name: Native Performance Diagnostics Tests

on:
  pull_request:
    paths:
      - "src/performance/**"
      - "src/game/nativeMapTransform.ts"
      - "src/components/MapViewportTransform*"
      - "src/components/MapWandererCharacter.tsx"
      - "src/components/MapWandererCharacter.native.tsx"
      - "src/performance/nativeResidentFrameBus.ts"
      - "src/performance/nativeResidentFrameBusDiagnostics.ts"
      - "src/performance/nativeResidentTimerQueue.ts"
      - "tests/native-resident-timer-queue.test.ts"
      - "tests/native-resident-timer-diagnostics.test.ts"
      - "tests/native-resident-timer-model-comparison.test.ts"
      - "tests/native-resident-dispatch-profiler.test.ts"
      - "tests/native-resident-responsiveness.test.ts"
      - "tests/native-resident-reentrant-lifecycle.test.ts"
      - "tests/native-resident-stateful-soak.test.ts"
      - "tests/native-resident-full-stack-integration.test.ts"
      - "tests/native-resident-buffer-reuse.test.ts"
      - "tests/native-resident-allocation-free-motion.test.ts"
      - "tests/native-resident-motion-buffer-benchmark.ts"
      - "tests/native-resident-timer-cooperative-batching.test.ts"
      - "tests/native-resident-timer-time-budget.test.ts"
      - "tests/native-resident-timer-burst-benchmark.ts"
      - "tests/native-resident-timer-time-budget-benchmark.ts"
      - "tests/native-resident-callback-relay.test.ts"
      - "tests/native-resident-relay-caching.test.ts"
      - "src/performance/nativeResidentTapRecognizer.ts"
      - "tests/native-resident-tap-recognizer.test.ts"
      - "src/performance/nativeCaptureIntegrity.ts"
      - "tests/native-capture-integrity.test.ts"
      - "src/performance/nativeHudFrameLoop.ts"
      - "tests/native-hud-frame-loop.test.ts"
      - "scripts/compare-native-js-reports.mjs"
      - "tests/native-js-report-comparison.test.mjs"
      - "tests/native-resident-relay-cache-benchmark.ts"
      - "tests/native-resident-sprite-frame-driver.test.ts"
      - "tests/native-resident-sprite-scheduler-integration.test.ts"
      - "src/performance/nativeResidentSegmentRunner.ts"
      - "tests/native-resident-segment-runner.test.ts"
      - "src/performance/nativeResidentFrameLifecycle.native.ts"
      - "src/performance/nativeResidentActivityGate.ts"
      - "tests/native-resident-activity-gate.test.ts"
      - "tests/native-resident-lifecycle-integration.test.ts"
      - "tests/native-resident-frame-bus.test.ts"
      - "tests/native-resident-frame-bus-benchmark.ts"
      - "tests/native-resident-platform-boundary.test.ts"
      - "tests/native-typecheck-regression.test.mjs"
      - "tests/fixtures/native-typecheck-baseline.json"
      - "scripts/check-native-typecheck-regressions.mjs"
      - "tests/native-map-transform.test.ts"
      - "src/game/pauseAwareMotionClock.ts"
      - "tests/pause-aware-motion-clock.test.ts"
      - "src/game/pendingCommuteRetry.ts"
      - "tests/pending-commute-retry.test.ts"
      - "tests/native-performance-diagnostics.test.ts"
      - "app/native-perf.tsx"
      - "src/performance/nativeRealResidentFixture.ts"
      - "src/performance/NativeRealResidentWorkload.tsx"
      - "tests/native-real-resident-fixture.test.ts"
      - "app/mappa.tsx"
      - ".github/workflows/native-perf-diagnostics.yml"
  workflow_dispatch:

# New commits supersede stale test/bundle runs for the same PR.
concurrency:
  group: native-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline TypeScript regression gate (legacy errors still fail general CI)
        run: |
          node --test tests/native-typecheck-regression.test.mjs
          node scripts/check-native-typecheck-regressions.mjs
      - name: Pure fixture and frame metric tests
        run: npx tsx --test tests/native-performance-diagnostics.test.ts tests/native-map-transform.test.ts tests/pause-aware-motion-clock.test.ts tests/pending-commute-retry.test.ts tests/native-resident-platform-boundary.test.ts tests/native-resident-frame-bus.test.ts tests/native-resident-activity-gate.test.ts tests/native-resident-lifecycle-integration.test.ts tests/native-resident-timer-queue.test.ts tests/native-resident-timer-diagnostics.test.ts tests/native-resident-timer-model-comparison.test.ts tests/native-resident-timer-cooperative-batching.test.ts tests/native-resident-timer-time-budget.test.ts tests/native-resident-callback-relay.test.ts tests/native-resident-sprite-frame-driver.test.ts tests/native-resident-sprite-scheduler-integration.test.ts tests/native-resident-segment-runner.test.ts tests/native-resident-dispatch-profiler.test.ts tests/native-resident-responsiveness.test.ts tests/native-resident-reentrant-lifecycle.test.ts
      - name: Device capture validity (scene, population, speed, pause) and offline three-run A/B reports
        run: |
          npx tsx --test tests/native-capture-integrity.test.ts
          node --test tests/native-js-report-comparison.test.mjs
      - name: 200 real native resident sprite fixture, occupancy and save-isolation regressions (Node only)
        run: npx tsx --test tests/native-real-resident-fixture.test.ts
      - name: Dev HUD opt-in RAF lifecycle and 200 collapse/background cycles (Node, not device FPS)
        run: npx tsx --test tests/native-hud-frame-loop.test.ts
      - name: Seeded 200-resident lifecycle/timer/RAF soak (Node fake OS, not FPS)
        run: npx tsx --test tests/native-resident-stateful-soak.test.ts tests/native-resident-full-stack-integration.test.ts
      - name: Allocation-free frame/timer buffer regression (Node only, not FPS)
        run: npx tsx --test tests/native-resident-buffer-reuse.test.ts
      - name: Allocation-free 200-resident movement and route churn (Node only, not FPS)
        run: npx tsx --test tests/native-resident-allocation-free-motion.test.ts
      - name: Native touch gesture and lifecycle regression (200 simulated residents, not physical touch)
        run: npx tsx --test tests/native-resident-tap-recognizer.test.ts
      - name: Cached live resident event callbacks and presence masks (Node, not on-device)
        run: npx tsx --test tests/native-resident-relay-caching.test.ts
      - name: 200-resident event relay allocation benchmark (Node only, not device FPS)
        run: npx tsx tests/native-resident-relay-cache-benchmark.ts
      - name: Synthetic resident movement allocation model (Node only, not device FPS)
        run: npx tsx tests/native-resident-motion-buffer-benchmark.ts
      - name: Synthetic persistent RAF registration benchmark (Node only, not FPS)
        run: npx tsx tests/native-resident-frame-bus-benchmark.ts
      - name: Synthetic timer burst benchmark (Node only, not FPS)
        run: npx tsx tests/native-resident-timer-burst-benchmark.ts
      - name: Synthetic timer time-slice workload model (fake clock, not touch/FPS)
        run: npx tsx tests/native-resident-timer-time-budget-benchmark.ts
  # Three independent workers: no longer block an iOS bundle behind Android
  # export, or a web smoke test behind both mobile exports. All are JS bundles
  # only; this workflow does NOT produce installable Android/iOS binaries.
  native-bundles:
    name: JS bundle ${{ matrix.platform }} (not device build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Expo JS bundle smoke test
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo export --platform ${{ matrix.platform }} --output-dir /tmp/mykingdom-native-${{ matrix.platform }}
