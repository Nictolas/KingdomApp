name: BK-006 static map entities refactor

on:
  push:
    branches:
      - refactor/map-static-entities-bk006

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow static entities extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/mappa.tsx')
          s = path.read_text()

          anchor = 'import { getResourceEmoji, getResourceRoute } from "../src/game/mappaRisorsePresentazione";\n'
          addition = '''import {\n  BAR_EDIFICIO,\n  CAPANNA,\n  DECORAZIONI_EMOJI,\n  DORMITORIO,\n  GIACIMENTO,\n  RAFFINERIA_MINERARIA,\n  SERRA_2_EDIFICIO,\n  SERRA_EDIFICIO,\n  STRADA_OPZIONE,\n  TRIBUNALE_EDIFICIO\n} from "../src/game/mappaEdificiStatici";\n'''
          if anchor not in s:
              raise SystemExit('import anchor not found')
          s = s.replace(anchor, anchor + addition, 1)

          block = '''const GIACIMENTO: EdificioInCella = { id: 0, nome: "Giacimento", emoji: "⛰️" };\nconst RAFFINERIA_MINERARIA: EdificioInCella = { id: 3, nome: "Raffineria Mineraria", emoji: "⚙️" };\n/** Opzione "Strada" per il dialog costruzione (cella diventa lastricato strada). */\nconst STRADA_OPZIONE: EdificioInCella = { id: -1, nome: "Strada", emoji: "🛤️" };\n\nconst DORMITORIO: EdificioInCella = { id: 14, nome: "Dormitorio", emoji: "🛏️" };\nconst BAR_EDIFICIO: EdificioInCella = { id: 17, nome: "Bar", emoji: "🍺" };\nconst TRIBUNALE_EDIFICIO: EdificioInCella = { id: 12, nome: "Tribunale", emoji: "⚖️" };\nconst SERRA_EDIFICIO: EdificioInCella = { id: 2, nome: "Serra", emoji: "🌱" };\nconst SERRA_2_EDIFICIO: EdificioInCella = { id: 21, nome: "Serra", emoji: "🌱" };\nconst CAPANNA: EdificioInCella = { id: 20, nome: "Capanna", emoji: "⛺" };\n\n/** Emoji per decorazioni procedurali sulla mappa (alberi, palme, cactus, vulcano). */\nconst DECORAZIONI_EMOJI = ["🌳", "🌲", "🌴", "🌵", "🌋"] as const;\n\n'''
          if block not in s:
              raise SystemExit('static entities block not found')
          s = s.replace(block, '', 1)
          path.write_text(s)

          Path('src/game/mappaEdificiStatici.ts').write_text('''import type { EdificioInCellaMappa } from "./mappaTypes";\n\nexport const GIACIMENTO: EdificioInCellaMappa = { id: 0, nome: "Giacimento", emoji: "⛰️" };\nexport const RAFFINERIA_MINERARIA: EdificioInCellaMappa = {\n  id: 3,\n  nome: "Raffineria Mineraria",\n  emoji: "⚙️"\n};\n/** Opzione "Strada" per il dialog costruzione (cella diventa lastricato strada). */\nexport const STRADA_OPZIONE: EdificioInCellaMappa = { id: -1, nome: "Strada", emoji: "🛤️" };\n\nexport const DORMITORIO: EdificioInCellaMappa = { id: 14, nome: "Dormitorio", emoji: "🛏️" };\nexport const BAR_EDIFICIO: EdificioInCellaMappa = { id: 17, nome: "Bar", emoji: "🍺" };\nexport const TRIBUNALE_EDIFICIO: EdificioInCellaMappa = { id: 12, nome: "Tribunale", emoji: "⚖️" };\nexport const SERRA_EDIFICIO: EdificioInCellaMappa = { id: 2, nome: "Serra", emoji: "🌱" };\nexport const SERRA_2_EDIFICIO: EdificioInCellaMappa = { id: 21, nome: "Serra", emoji: "🌱" };\nexport const CAPANNA: EdificioInCellaMappa = { id: 20, nome: "Capanna", emoji: "⛺" };\n\n/** Emoji per decorazioni procedurali sulla mappa (alberi, palme, cactus, vulcano). */\nexport const DECORAZIONI_EMOJI = ["🌳", "🌲", "🌴", "🌵", "🌋"] as const;\n''')

          Path('tests/mappa-edifici-statici.test.ts').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport {\n  BAR_EDIFICIO,\n  CAPANNA,\n  DECORAZIONI_EMOJI,\n  DORMITORIO,\n  GIACIMENTO,\n  RAFFINERIA_MINERARIA,\n  SERRA_2_EDIFICIO,\n  SERRA_EDIFICIO,\n  STRADA_OPZIONE,\n  TRIBUNALE_EDIFICIO\n} from "../src/game/mappaEdificiStatici";\n\ntest("static map building templates preserve ids, names and emoji", () => {\n  const entries = [\n    GIACIMENTO,\n    RAFFINERIA_MINERARIA,\n    STRADA_OPZIONE,\n    DORMITORIO,\n    BAR_EDIFICIO,\n    TRIBUNALE_EDIFICIO,\n    SERRA_EDIFICIO,\n    SERRA_2_EDIFICIO,\n    CAPANNA\n  ];\n  assert.deepEqual(\n    entries.map(({ id, nome, emoji }) => ({ id, nome, emoji })),\n    [\n      { id: 0, nome: "Giacimento", emoji: "⛰️" },\n      { id: 3, nome: "Raffineria Mineraria", emoji: "⚙️" },\n      { id: -1, nome: "Strada", emoji: "🛤️" },\n      { id: 14, nome: "Dormitorio", emoji: "🛏️" },\n      { id: 17, nome: "Bar", emoji: "🍺" },\n      { id: 12, nome: "Tribunale", emoji: "⚖️" },\n      { id: 2, nome: "Serra", emoji: "🌱" },\n      { id: 21, nome: "Serra", emoji: "🌱" },\n      { id: 20, nome: "Capanna", emoji: "⛺" }\n    ]\n  );\n});\n\ntest("procedural decoration emoji remain unchanged", () => {\n  assert.deepEqual([...DECORAZIONI_EMOJI], ["🌳", "🌲", "🌴", "🌵", "🌋"]);\n});\n''')
          PY
      - name: Diff sanity
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'app/mappa.tsx',
              'src/game/mappaEdificiStatici.ts',
              'tests/mappa-edifici-statici.test.ts',
          }
          tracked = set(filter(None, subprocess.check_output(['git','diff','--name-only']).decode().splitlines()))
          untracked = set(filter(None, subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines()))
          actual = tracked | untracked
          if actual != expected:
              raise SystemExit(f'unexpected diff: {sorted(actual)}')
          subprocess.check_call(['git', 'diff', '--check'])
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Phaser tests
        run: npm run test:phaser
      - name: Build web
        run: npm run build:web
      - name: Commit refactor and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/bk006-static-entities.yml
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git add -A
          git commit -m "Extract static map entities" -m "Continue BK-006 by moving static map building templates and procedural decoration emoji out of app/mappa.tsx with regression tests. No gameplay or rendering changes."
          git push origin HEAD
