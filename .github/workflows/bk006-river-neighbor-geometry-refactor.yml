name: BK-006 river-neighbor geometry refactor

on:
  push:
    branches:
      - refactor/map-river-neighbor-geometry-bk006

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/map-river-neighbor-geometry-bk006
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow geometry extraction
        run: python3 scripts/bk006-river-neighbor-geometry.py

      - name: Diff sanity
        run: |
          git diff --check
          git diff -- app/mappa.tsx src/game/mappaGeometry.ts tests/mappa-geometry.test.ts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Commit refactor and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/bk006-river-neighbor-geometry-refactor.yml
          rm scripts/bk006-river-neighbor-geometry.py
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git add -A
          git commit -m "Extract river-neighbor map geometry helpers" -m "Continue BK-006 by moving haVicinoFiume and cellaSoloErba into mappaGeometry.ts with regression tests. [bk006-river-neighbor-geometry-applied]"
          git push origin HEAD:refactor/map-river-neighbor-geometry-bk006
