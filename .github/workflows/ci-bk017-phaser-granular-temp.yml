name: BK017 Phaser Granular Codemod

on:
  push:
    branches:
      - perf/bk017-granular-phaser-updates

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bk017-granular-phaser-updates
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch KingdomMapScene
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/phaser/scenes/KingdomMapScene.ts")
          s = p.read_text()

          old_import = 'import type { MapSceneBridge, PhaserMapBuilding, PhaserMapSnapshot } from "../adapters/mapSceneBridge";'
          new_import = 'import {\n  getPhaserDynamicSnapshotChanges,\n  type MapSceneBridge,\n  type PhaserMapBuilding,\n  type PhaserMapSnapshot\n} from "../adapters/mapSceneBridge";'
          if old_import not in s:
              raise SystemExit("mapSceneBridge import marker not found")
          s = s.replace(old_import, new_import, 1)

          old_field = '  private renderedRevision = -1;\n  private waterSprites: Phaser.GameObjects.Image[] = [];'
          new_field = '  private renderedRevision = -1;\n  private renderedSnapshot: PhaserMapSnapshot | null = null;\n  private waterSprites: Phaser.GameObjects.Image[] = [];'
          if old_field not in s:
              raise SystemExit("renderedRevision field marker not found")
          s = s.replace(old_field, new_field, 1)

          old_sub = '''    this.unsubscribe = this.bridge.subscribe(() => {\n      const snapshot = this.bridge.getSnapshot();\n      if (snapshot.revision !== this.renderedRevision) this.renderSnapshot(snapshot);\n      else {\n        this.reconcileCharacters(snapshot);\n        this.renderGrid(snapshot);\n        this.renderInteraction(snapshot);\n      }\n    });'''
          new_sub = '''    this.unsubscribe = this.bridge.subscribe(() => {\n      const snapshot = this.bridge.getSnapshot();\n      if (snapshot.revision !== this.renderedRevision || this.renderedSnapshot == null) {\n        this.renderSnapshot(snapshot);\n        return;\n      }\n\n      const changes = getPhaserDynamicSnapshotChanges(this.renderedSnapshot, snapshot);\n      if (changes.characters) this.reconcileCharacters(snapshot);\n      if (changes.grid) this.renderGrid(snapshot);\n      if (changes.interaction) this.renderInteraction(snapshot);\n      this.renderedSnapshot = snapshot;\n    });'''
          if old_sub not in s:
              raise SystemExit("bridge subscriber marker not found")
          s = s.replace(old_sub, new_sub, 1)

          old_render_end = '''    this.renderBuildings(snapshot);\n    this.reconcileCharacters(snapshot);\n    this.renderGrid(snapshot);\n    this.renderInteraction(snapshot);\n  }'''
          new_render_end = '''    this.renderBuildings(snapshot);\n    this.reconcileCharacters(snapshot);\n    this.renderGrid(snapshot);\n    this.renderInteraction(snapshot);\n    this.renderedSnapshot = snapshot;\n  }'''
          if old_render_end not in s:
              raise SystemExit("renderSnapshot end marker not found")
          s = s.replace(old_render_end, new_render_end, 1)

          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/phaser/scenes/KingdomMapScene.ts
          git diff --cached --quiet && exit 0
          git commit -m "BK-017: update only changed Phaser layers"
          git push origin HEAD:perf/bk017-granular-phaser-updates
