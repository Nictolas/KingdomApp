name: BK-006 map cell type dedupe

on:
  push:
    branches:
      - refactor/map-cell-type-bk006

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow type dedupe
        run: python scripts/bk006-type-dedupe.py
      - name: Diff sanity
        run: |
          git diff --check
          test "$(git diff --name-only)" = "app/mappa.tsx"
          git diff -- app/mappa.tsx
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Phaser tests
        run: npm run test:phaser
      - name: Build web
        run: npm run build:web
      - name: Commit refactor and remove temporary files
        run: |
          rm scripts/bk006-type-dedupe.py .github/workflows/bk006-map-cell-type.yml
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git add -A
          git commit -m "Reuse shared map cell type" -m "Continue BK-006 by removing the duplicate local EdificioInCella type from app/mappa.tsx and reusing EdificioInCellaMappa from mappaTypes. Type-only refactor; no runtime behavior changes."
          git push
