name: Phaser Performance Benchmark

on:
  pull_request:
    paths:
      - "src/phaser/**"
      - "scripts/phaser-perf-benchmark.mjs"
      - ".github/workflows/perf-benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build:web
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exported web app
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/kingdom-http.log 2>&1 &
          echo $! > /tmp/kingdom-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kingdom-http.log
          exit 1
      - name: Run Phaser benchmark
        shell: bash
        run: |
          set -o pipefail
          node scripts/phaser-perf-benchmark.mjs | tee phaser-perf-results.txt
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaser-perf-results
          path: phaser-perf-results.txt
          retention-days: 14
