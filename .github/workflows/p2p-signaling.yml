name: My Kingdom - P2P manual signaling

on:
  pull_request:
    paths:
      - 'src/multiplayer/signalingProtocol.ts'
      - 'src/multiplayer/lanSession.ts'
      - 'tests/p2p-manual-signaling.test.mjs'
      - '.github/workflows/p2p-signaling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test signaling and peer handshakes
        run: npx tsx --test tests/p2p-manual-signaling.test.mjs tests/encrypted-save-storage.test.mjs
