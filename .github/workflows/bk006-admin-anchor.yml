name: BK006 admin anchor extraction

on:
  push:
    branches:
      - refactor/map-admin-anchor-bk006

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract helper from mappa.tsx
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/mappa.tsx")
          text = path.read_text(encoding="utf-8")

          old_import = '''import {
            estendiVietatoConFootprintECuscino,
            puòPiazzareFootprintConCuscino,
            trovaAnchorFootprintLibero,
            trovaCellaSingolaConCuscino
          } from "../src/game/mappaPiazzamentoFootprint";'''
          new_import = '''import {
            estendiVietatoConFootprintECuscino,
            puòPiazzareFootprintConCuscino,
            scegliAnchorComplessoAmministrativo,
            trovaAnchorFootprintLibero,
            trovaCellaSingolaConCuscino
          } from "../src/game/mappaPiazzamentoFootprint";'''
          if old_import not in text:
              raise SystemExit("Expected mappaPiazzamentoFootprint import block not found")
          text = text.replace(old_import, new_import, 1)

          start_marker = '''/**
           * Angolo in alto a sinistra del blocco ADMIN_FOOTPRINT_W×H, scelto in modo deterministico:'''
          end_marker = '''/** Complesso amministrativo: rettangolo 3×2 (6 celle), `anchor` già riservato ai fiumi. */'''
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Administrative anchor helper block not found")
          block = text[start:end]
          if "function scegliAnchorComplessoAmministrativo" not in block:
              raise SystemExit("Unexpected helper block")
          text = text[:start] + text[end:]

          path.write_text(text, encoding="utf-8")

      - name: Diff sanity
        run: |
          test "$(git diff --name-only)" = "app/mappa.tsx"
          git diff --check
          grep -q "scegliAnchorComplessoAmministrativo" app/mappa.tsx
          ! grep -q "function scegliAnchorComplessoAmministrativo" app/mappa.tsx

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Finalize branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bk006-admin-anchor.yml
          git add app/mappa.tsx
          git commit -m "Extract administrative complex anchor helper" -m "Continue BK-006 by moving scegliAnchorComplessoAmministrativo out of app/mappa.tsx with deterministic tests. No building writer, gameplay, or rendering changes. [bk006-final]"
          git push
