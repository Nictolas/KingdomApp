name: BK-006 construction preview extraction

on:
  push:
    branches:
      - refactor/map-construction-preview-selection-bk006

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/map-construction-preview-selection-bk006
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow extraction
        run: python3 scripts/bk006-construction-preview-selection.py

      - name: Diff sanity
        run: |
          git diff --check
          actual="$(git ls-files --modified --others --exclude-standard | sort)"
          expected="$(printf '%s\n' app/mappa.tsx src/game/mappaCostruzioneAnteprima.ts tests/mappa-costruzione-anteprima.test.ts | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Commit refactor and remove temporary files
        run: |
          rm .github/workflows/bk006-construction-preview-selection.yml scripts/bk006-construction-preview-selection.py
          git add -A
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git commit -m "Extract construction preview selection helpers" -m "Continue BK-006 by moving the construction-preview selection type, persistent terrain-mode predicate, and 2x2 anchor wrapper out of app/mappa.tsx with deterministic tests. No gameplay or rendering changes."
          git push origin HEAD:refactor/map-construction-preview-selection-bk006
