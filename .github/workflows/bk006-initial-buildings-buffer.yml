name: BK006 initial buildings buffer extraction

on:
  push:
    branches:
      - refactor/map-initial-buildings-buffer-bk006

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract helper from mappa.tsx
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/mappa.tsx")
          text = path.read_text(encoding="utf-8")

          old_import = '''  scegliAnchorComplessoAmministrativo,
            trovaAnchorFootprintLibero,
            trovaCellaSingolaConCuscino
          } from "../src/game/mappaPiazzamentoFootprint";'''
          new_import = '''  scegliAnchorComplessoAmministrativo,
            trovaAnchorFootprintLibero,
            trovaCellaSingolaConCuscino,
            vietatoFootprintECuscinoDaEdificiIniziali
          } from "../src/game/mappaPiazzamentoFootprint";'''
          if old_import not in text:
              raise SystemExit("Expected mappaPiazzamentoFootprint import block not found")
          text = text.replace(old_import, new_import, 1)

          start_marker = '''/** Footprint ∪ cuscino d'erba (8 direzioni) per ogni edificio iniziale ancorato: evita capanne/giacimenti sul verde riservato. */'''
          end_marker = '''function footprintTerreno2x2Valido('''
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Initial buildings buffer helper block not found")
          block = text[start:end]
          if "function vietatoFootprintECuscinoDaEdificiIniziali" not in block:
              raise SystemExit("Unexpected helper block")
          text = text[:start] + text[end:]

          path.write_text(text, encoding="utf-8")

      - name: Diff sanity
        run: |
          test "$(git diff --name-only)" = "app/mappa.tsx"
          git diff --check
          grep -q "vietatoFootprintECuscinoDaEdificiIniziali" app/mappa.tsx
          ! grep -q "function vietatoFootprintECuscinoDaEdificiIniziali" app/mappa.tsx

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Finalize branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bk006-initial-buildings-buffer.yml
          git add app/mappa.tsx
          git commit -m "Extract initial buildings forbidden-buffer helper" -m "Continue BK-006 by moving vietatoFootprintECuscinoDaEdificiIniziali out of app/mappa.tsx with deterministic tests. No building placement, gameplay, or rendering changes. [bk006-final]"
          git push
