name: BK-006 initial road links extraction

on:
  push:
    branches:
      - refactor/map-initial-road-links-bk006

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/map-initial-road-links-bk006
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow extraction
        run: python3 scripts/bk006-initial-road-links.py

      - name: Diff sanity
        run: |
          git diff --check
          printf '%s\n' "$(git diff --name-only | sort)"
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' app/mappa.tsx src/game/mappaStradeIniziali.ts tests/mappa-strade-iniziali.test.ts | sort)"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Commit refactor and remove temporary files
        run: |
          rm .github/workflows/bk006-initial-road-links.yml scripts/bk006-initial-road-links.py
          git add -A
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git commit -m "Extract initial road link helper" -m "Continue BK-006 by moving getStradeIniziali out of app/mappa.tsx into a pure map helper with deterministic regression tests. No gameplay or rendering changes."
          git push origin HEAD:refactor/map-initial-road-links-bk006
