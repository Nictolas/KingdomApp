name: BK-006 forbidden footprint buffer

on:
  push:
    branches:
      - refactor/map-forbidden-footprint-buffer-bk006

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/map-forbidden-footprint-buffer-bk006
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow extraction
        run: python3 scripts/bk006_extract_forbidden_footprint_buffer.py

      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            'app/mappa.tsx' \
            'src/game/mappaPiazzamentoFootprint.ts' \
            'tests/mappa-piazzamento-footprint.test.ts' | sort -u)"
          echo "Changed files:"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Commit refactor and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bk006-forbidden-footprint-buffer.yml
          rm scripts/bk006_extract_forbidden_footprint_buffer.py
          git add -A
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git commit -m "Extract forbidden footprint buffer helper" -m "Continue BK-006 by moving estendiVietatoConFootprintECuscino out of app/mappa.tsx with deterministic tests. No placement-decision, gameplay, or rendering changes."
          git push origin HEAD:refactor/map-forbidden-footprint-buffer-bk006
