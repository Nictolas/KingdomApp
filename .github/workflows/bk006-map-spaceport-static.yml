name: BK-006 spaceport static extraction

on:
  push:
    branches:
      - refactor/map-spaceport-static-bk006

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow static extraction
        run: python scripts/bk006-spaceport-static.py
      - name: Diff sanity
        run: |
          git diff --check
          printf '%s\n' 'app/mappa.tsx' 'src/game/mappaEdificiStatici.ts' 'tests/mappa-edifici-statici.test.ts' > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --stat
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Phaser tests
        run: npm run test:phaser
      - name: Build web
        run: npm run build:web
      - name: Commit refactor and remove temporary files
        run: |
          rm scripts/bk006-spaceport-static.py .github/workflows/bk006-map-spaceport-static.yml
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git add -A
          git commit -m "Extract static spaceport template" -m "Continue BK-006 by moving the remaining static Spazioporto map template into mappaEdificiStatici and extending its regression test. No gameplay or rendering changes."
          git push
