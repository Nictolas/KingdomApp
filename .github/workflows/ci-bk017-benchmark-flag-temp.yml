name: BK017 Benchmark Flag Codemod

on:
  push:
    branches:
      - perf/bk017-headless-benchmark

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bk017-headless-benchmark
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch benchmark activation flag
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/phaser/scenes/KingdomMapScene.ts")
          s = p.read_text()
          old = '    this.perfEnabled = typeof window !== "undefined" && new URLSearchParams(window.location.search).get("perf") === "1";'
          new = '    this.perfEnabled = (globalThis as any).__KINGDOM_PERF_REQUESTED__ === true || (typeof window !== "undefined" && new URLSearchParams(window.location.search).get("perf") === "1");'
          if new not in s:
              if old not in s:
                  raise SystemExit("perf activation marker not found")
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/phaser/scenes/KingdomMapScene.ts
          git diff --cached --quiet && exit 0
          git commit -m "BK-017: allow deterministic benchmark activation"
          git push origin HEAD:perf/bk017-headless-benchmark
