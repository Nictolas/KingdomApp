name: BK-006 map Manhattan refactor

on:
  push:
    branches:
      - refactor/map-manhattan-geometry-bk006

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[bk006-manhattan-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/map-manhattan-geometry-bk006

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow Manhattan geometry extraction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('app/mappa.tsx')
          app = app_path.read_text(encoding='utf-8')

          old_import = '''import {\n  getIndiciCuscinoErba,\n  getIndiciFootprint,\n  getVicini8,\n  isAcqua\n} from "../src/game/mappaGeometry";'''
          new_import = '''import {\n  expandAxisToUnitSteps,\n  getIndiciCuscinoErba,\n  getIndiciFootprint,\n  getManhattanPathSegments,\n  getVicini8,\n  isAcqua\n} from "../src/game/mappaGeometry";'''
          if app.count(old_import) != 1:
              raise SystemExit(f'Expected geometry import exactly once, found {app.count(old_import)}')
          app = app.replace(old_import, new_import, 1)

          expand_block = '''/**\n * Tra due celle sulla stessa riga o colonna, restituisce solo coppie adiacenti (un passo ortogonale per segmento).\n * Non restituisce mai un singolo segmento che "salta" più celle.\n */\nfunction expandAxisToUnitSteps(from: number, to: number, cols: number): [number, number][] {\n  const c1 = from % cols;\n  const r1 = Math.floor(from / cols);\n  const c2 = to % cols;\n  const r2 = Math.floor(to / cols);\n  if (r1 !== r2 && c1 !== c2) return [];\n  const out: [number, number][] = [];\n  if (r1 === r2) {\n    if (c1 === c2) return [];\n    const step = c2 > c1 ? 1 : -1;\n    for (let c = c1; c !== c2; c += step) {\n      const i = r1 * cols + c;\n      out.push([i, i + step]);\n    }\n  } else {\n    const step = r2 > r1 ? cols : -cols;\n    for (let i = from; i !== to; i += step) {\n      out.push([i, i + step]);\n    }\n  }\n  return out;\n}\n\n'''
          manhattan_block = '''/** Percorso a L in soli passi ortogonali adiacenti (ogni segmento collega due celle vicine). */\nfunction getManhattanPathSegments(from: number, to: number, cols: number): [number, number][] {\n  const c1 = from % cols;\n  const r1 = Math.floor(from / cols);\n  const c2 = to % cols;\n  const r2 = Math.floor(to / cols);\n  if (c1 === c2 && r1 === r2) return [];\n  if (c1 === c2) return expandAxisToUnitSteps(from, to, cols);\n  if (r1 === r2) return expandAxisToUnitSteps(from, to, cols);\n  const mid = r1 * cols + c2;\n  return [...expandAxisToUnitSteps(from, mid, cols), ...expandAxisToUnitSteps(mid, to, cols)];\n}\n\n'''
          for block, name in [(expand_block, 'expandAxisToUnitSteps'), (manhattan_block, 'getManhattanPathSegments')]:
              if app.count(block) != 1:
                  raise SystemExit(f'Expected {name} block exactly once, found {app.count(block)}')
              app = app.replace(block, '', 1)

          app_path.write_text(app, encoding='utf-8')

          geometry_path = Path('src/game/mappaGeometry.ts')
          geometry = geometry_path.read_text(encoding='utf-8')
          addition = '''\n\n/** Adjacent orthogonal segments between cells on the same row or column. */\nexport function expandAxisToUnitSteps(from: number, to: number, cols: number): [number, number][] {\n  const c1 = from % cols;\n  const r1 = Math.floor(from / cols);\n  const c2 = to % cols;\n  const r2 = Math.floor(to / cols);\n  if (r1 !== r2 && c1 !== c2) return [];\n  const out: [number, number][] = [];\n  if (r1 === r2) {\n    if (c1 === c2) return [];\n    const step = c2 > c1 ? 1 : -1;\n    for (let c = c1; c !== c2; c += step) {\n      const i = r1 * cols + c;\n      out.push([i, i + step]);\n    }\n  } else {\n    const step = r2 > r1 ? cols : -cols;\n    for (let i = from; i !== to; i += step) {\n      out.push([i, i + step]);\n    }\n  }\n  return out;\n}\n\n/** L-shaped Manhattan path represented only by adjacent orthogonal cell pairs. */\nexport function getManhattanPathSegments(from: number, to: number, cols: number): [number, number][] {\n  const c1 = from % cols;\n  const r1 = Math.floor(from / cols);\n  const c2 = to % cols;\n  const r2 = Math.floor(to / cols);\n  if (c1 === c2 && r1 === r2) return [];\n  if (c1 === c2) return expandAxisToUnitSteps(from, to, cols);\n  if (r1 === r2) return expandAxisToUnitSteps(from, to, cols);\n  const mid = r1 * cols + c2;\n  return [...expandAxisToUnitSteps(from, mid, cols), ...expandAxisToUnitSteps(mid, to, cols)];\n}\n'''
          if 'export function expandAxisToUnitSteps' in geometry or 'export function getManhattanPathSegments' in geometry:
              raise SystemExit('Manhattan helpers already exist in mappaGeometry.ts')
          geometry_path.write_text(geometry + addition, encoding='utf-8')

          test_path = Path('tests/mappa-geometry.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          old_test_import = '''import {\n  getIndiciCuscinoErba,\n  getIndiciFootprint,\n  getVicini8,\n  isAcqua\n} from "../src/game/mappaGeometry.ts";'''
          new_test_import = '''import {\n  expandAxisToUnitSteps,\n  getIndiciCuscinoErba,\n  getIndiciFootprint,\n  getManhattanPathSegments,\n  getVicini8,\n  isAcqua\n} from "../src/game/mappaGeometry.ts";'''
          if tests.count(old_test_import) != 1:
              raise SystemExit('Expected test geometry import exactly once')
          tests = tests.replace(old_test_import, new_test_import, 1)
          tests += '''\n\ntest("expandAxisToUnitSteps restituisce solo segmenti adiacenti", () => {\n  assert.deepEqual(expandAxisToUnitSteps(6, 9, 5), [[6, 7], [7, 8], [8, 9]]);\n  assert.deepEqual(expandAxisToUnitSteps(16, 6, 5), [[16, 11], [11, 6]]);\n  assert.deepEqual(expandAxisToUnitSteps(6, 12, 5), []);\n});\n\ntest("getManhattanPathSegments conserva il percorso a L corrente", () => {\n  assert.deepEqual(getManhattanPathSegments(6, 18, 5), [\n    [6, 7],\n    [7, 8],\n    [8, 13],\n    [13, 18]\n  ]);\n  assert.deepEqual(getManhattanPathSegments(18, 6, 5), [\n    [18, 17],\n    [17, 16],\n    [16, 11],\n    [11, 6]\n  ]);\n  assert.deepEqual(getManhattanPathSegments(12, 12, 5), []);\n});\n'''
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Diff sanity
        run: git diff --check && git diff --stat

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Commit refactor and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/bk006-map-manhattan-refactor.yml
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git add -A
          git commit -m "Extract Manhattan map geometry helpers" -m "Continue BK-006 by moving only pure orthogonal-segment helpers into mappaGeometry.ts, with regression tests. [bk006-manhattan-applied]"
          git push origin HEAD:refactor/map-manhattan-geometry-bk006
