name: BK017 Browser Benchmark Temp

on:
  push:
    branches:
      - perf/bk017-browser-benchmark

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build PR 57 baseline
        run: |
          git checkout bd52f8acdbcadc1316f8f9131f6bb545fc7e0f18
          npm run build:web
          mv dist /tmp/dist-before

      - name: Build PR 58 current
        run: |
          git checkout "$GITHUB_SHA"
          npm run build:web
          mv dist /tmp/dist-after

      - name: Install benchmark driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Run Chromium benchmark
        shell: bash
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          echo "Using Chrome: $CHROME_PATH"
          python3 -m http.server 4173 -d /tmp/dist-before >/tmp/before-server.log 2>&1 &
          python3 -m http.server 4174 -d /tmp/dist-after >/tmp/after-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent http://127.0.0.1:4174/ >/dev/null
          CHROME_PATH="$CHROME_PATH" node ./bk017-browser-benchmark-temp.mjs
