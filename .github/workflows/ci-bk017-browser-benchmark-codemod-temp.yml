name: BK017 Browser Benchmark Codemod

on:
  push:
    branches:
      - perf/bk017-browser-benchmark

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bk017-browser-benchmark
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Expose perf metrics to benchmark harness
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/phaser/scenes/KingdomMapScene.ts")
          s = p.read_text()
          old = '''        const metrics = this.framePerformance.snapshot();
        this.perfOverlay?.setText(formatPhaserFramePerformance(metrics));
        this.perfOverlay?.setScale(1 / this.cameras.main.zoom);
        this.nextPerfOverlayAt = time + 1000;'''
          new = '''        const metrics = this.framePerformance.snapshot();
        this.perfOverlay?.setText(formatPhaserFramePerformance(metrics));
        this.perfOverlay?.setScale(1 / this.cameras.main.zoom);
        if (typeof window !== "undefined") {
          const perfWindow = window as Window & {
            __MYKINGDOM_PERF__?: typeof metrics;
            __MYKINGDOM_PERF_RESET__?: () => void;
          };
          perfWindow.__MYKINGDOM_PERF__ = metrics;
          perfWindow.__MYKINGDOM_PERF_RESET__ ??= () => {
            this.framePerformance.reset();
            perfWindow.__MYKINGDOM_PERF__ = this.framePerformance.snapshot();
          };
        }
        this.nextPerfOverlayAt = time + 1000;'''
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit("perf metrics marker not found")
          p.write_text(s.replace(old, new, 1))
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/phaser/scenes/KingdomMapScene.ts
          git diff --cached --quiet && exit 0
          git commit -m "BK-017: expose frame metrics to browser benchmark"
          git push origin HEAD:perf/bk017-browser-benchmark
