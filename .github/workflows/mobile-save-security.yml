name: My Kingdom - encrypted mobile saves

on:
  pull_request:
    paths:
      - 'src/persistence/createGameSaveStorage.ts'
      - 'src/persistence/encryptedSaveStorage.ts'
      - 'tests/encrypted-save-storage.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-save-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-save-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted encrypted save tests
        run: npx tsx --test tests/encrypted-save-storage.test.mjs
