name: BK-006 residence footprint refactor

on:
  push:
    branches:
      - refactor/map-residence-footprint-bk006

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/map-residence-footprint-bk006
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow residence footprint extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mappa_path = Path("app/mappa.tsx")
          mappa = mappa_path.read_text(encoding="utf-8")

          import_old = '''import {
            distribuisciAbitantiSuAnchorCapanne,'''
          import_new = '''import {
            cellaÈNelFootprintResidenzaMappa,
            distribuisciAbitantiSuAnchorCapanne,'''
          if mappa.count(import_old) != 1:
              raise SystemExit("Unexpected residenzaMappa import block")
          mappa = mappa.replace(import_old, import_new, 1)

          helper = '''/**
           * True se la cella fa parte dell’impronta di una residenza (Baracca, Capanna, Dormitorio).
           * Il passeggiatore sopra non deve rubare il doppio tap alla griglia (elenco residenti).
           */
          function cellaÈNelFootprintResidenzaMappa(
            cellIndex: number,
            edificiInMappa: Record<number, EdificioInCella>,
            cols: number
          ): boolean {
            const e = edificiInMappa[cellIndex];
            if (!e || !èResidenzaMappa(e.nome)) return false;
            const anchor = getAnchorCellPerEdificio(cellIndex, edificiInMappa);
            const cap = edificiInMappa[anchor];
            if (!cap || !èResidenzaMappa(cap.nome)) return false;
            const w = cap.footprint?.w ?? 1;
            const h = cap.footprint?.h ?? 1;
            return getIndiciFootprint(anchor, w, h, cols).includes(cellIndex);
          }

          '''
          if mappa.count(helper) != 1:
              raise SystemExit("Unexpected local residence footprint helper")
          mappa = mappa.replace(helper, "", 1)
          mappa_path.write_text(mappa, encoding="utf-8")

          res_path = Path("src/game/residenzaMappa.ts")
          res = res_path.read_text(encoding="utf-8")
          type_import = 'import type { EdificioInCellaMappa } from "./mappaTypes";\n'
          if res.count(type_import) != 1:
              raise SystemExit("Unexpected mappaTypes import")
          res = res.replace(
              type_import,
              type_import + 'import { getIndiciFootprint } from "./mappaGeometry";\n',
              1,
          )

          insertion_anchor = '''export function èResidenzaMappa(nome: string | undefined): boolean {
            return nome != null && NOMI_RESIDENZE_MAPPA.has(nome);
          }

          '''
          exported_helper = '''export function cellaÈNelFootprintResidenzaMappa(
            cellIndex: number,
            edificiInMappa: Record<number, EdificioInCellaMappa>,
            cols: number
          ): boolean {
            const e = edificiInMappa[cellIndex];
            if (!e || !èResidenzaMappa(e.nome)) return false;
            const anchor = getAnchorCellPerEdificio(cellIndex, edificiInMappa);
            const cap = edificiInMappa[anchor];
            if (!cap || !èResidenzaMappa(cap.nome)) return false;
            const w = cap.footprint?.w ?? 1;
            const h = cap.footprint?.h ?? 1;
            return getIndiciFootprint(anchor, w, h, cols).includes(cellIndex);
          }

          '''
          if res.count(insertion_anchor) != 1:
              raise SystemExit("Unexpected residence predicate anchor")
          res = res.replace(insertion_anchor, insertion_anchor + exported_helper, 1)
          res_path.write_text(res, encoding="utf-8")

          test_path = Path("tests/residenza-mappa-footprint.test.ts")
          if test_path.exists():
              raise SystemExit("Test file already exists")
          test_path.write_text('''import assert from "node:assert/strict";
          import test from "node:test";

          import {
            cellaÈNelFootprintResidenzaMappa
          } from "../src/game/residenzaMappa.ts";
          import type { EdificioInCellaMappa } from "../src/game/mappaTypes.ts";

          test("cellaÈNelFootprintResidenzaMappa riconosce anchor e celle secondarie della residenza", () => {
            const edifici: Record<number, EdificioInCellaMappa> = {
              6: { id: 20, nome: "Capanna", emoji: "", footprint: { w: 2, h: 1 } },
              7: { id: 20, nome: "Capanna", emoji: "", footprintRef: 6 }
            };

            assert.equal(cellaÈNelFootprintResidenzaMappa(6, edifici, 5), true);
            assert.equal(cellaÈNelFootprintResidenzaMappa(7, edifici, 5), true);
            assert.equal(cellaÈNelFootprintResidenzaMappa(8, edifici, 5), false);
          });

          test("cellaÈNelFootprintResidenzaMappa rifiuta edifici non residenziali e riferimenti orfani", () => {
            const edifici: Record<number, EdificioInCellaMappa> = {
              10: { id: 2, nome: "Serra", emoji: "", footprint: { w: 2, h: 1 } },
              11: { id: 2, nome: "Serra", emoji: "", footprintRef: 10 },
              12: { id: 20, nome: "Capanna", emoji: "", footprintRef: 99 },
              15: { id: 99, nome: "Baracca", emoji: "" }
            };

            assert.equal(cellaÈNelFootprintResidenzaMappa(10, edifici, 5), false);
            assert.equal(cellaÈNelFootprintResidenzaMappa(11, edifici, 5), false);
            assert.equal(cellaÈNelFootprintResidenzaMappa(12, edifici, 5), false);
            assert.equal(cellaÈNelFootprintResidenzaMappa(15, edifici, 5), true);
          });
          ''', encoding="utf-8")
          PY

      - name: Diff sanity
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              "app/mappa.tsx",
              "src/game/residenzaMappa.ts",
              "tests/residenza-mappa-footprint.test.ts",
              ".github/workflows/bk006-residence-footprint.yml",
          }
          changed = set()
          for line in subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines():
              changed.add(line[3:])
          if changed != expected:
              raise SystemExit(f"Unexpected changed files: {sorted(changed)}")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Commit refactor and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git rm .github/workflows/bk006-residence-footprint.yml
          git add app/mappa.tsx src/game/residenzaMappa.ts tests/residenza-mappa-footprint.test.ts
          git diff --cached --check
          git commit -m "Extract residence footprint helper" -m "Continue BK-006 by moving the pure residence-footprint hit test into residenzaMappa with regression tests. No gameplay or rendering changes."
          git push origin HEAD:refactor/map-residence-footprint-bk006
