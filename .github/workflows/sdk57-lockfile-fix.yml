name: SDK 57 Lockfile Repair

on:
  push:
    branches:
      - fix/sdk57-lockfile-ci

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/sdk57-lockfile-ci

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile with standard npm resolution
        run: npm install --package-lock-only

      - name: Verify clean install
        run: npm ci

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Commit repaired lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "fix: repair SDK 57 package lock for npm ci"
          git push origin HEAD:fix/sdk57-lockfile-ci
