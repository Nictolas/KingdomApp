name: BK-010 Mobile Assets

on:
  push:
    branches:
      - fix/mobile-app-assets-bk010

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-app-assets-bk010

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install splash screen package
        run: npx expo install expo-splash-screen

      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate valid mobile assets and configure Expo
        shell: python
        run: |
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw

          ASSETS = Path('assets')
          ASSETS.mkdir(exist_ok=True)
          GREEN = '#0b3d1f'
          GOLD = '#d4af37'
          GOLD_LIGHT = '#f1d16a'

          def crown(draw, scale=1.0, ox=0, oy=0, fill=GOLD):
              pts = [
                  (240, 620), (300, 360), (420, 500),
                  (512, 290), (604, 500), (724, 360), (784, 620)
              ]
              pts = [(int(ox + x*scale), int(oy + y*scale)) for x, y in pts]
              draw.polygon(pts, fill=fill)
              x1, y1 = int(ox + 275*scale), int(oy + 600*scale)
              x2, y2 = int(ox + 749*scale), int(oy + 705*scale)
              draw.rounded_rectangle((x1, y1, x2, y2), radius=max(1, int(22*scale)), fill=fill)
              for x in (350, 512, 674):
                  r = max(2, int(18*scale))
                  cx, cy = int(ox + x*scale), int(oy + 650*scale)
                  draw.ellipse((cx-r, cy-r, cx+r, cy+r), fill=GOLD_LIGHT)

          # Main icon: opaque 1024x1024, suitable for iOS and fallback Android icon.
          icon = Image.new('RGB', (1024, 1024), GREEN)
          d = ImageDraw.Draw(icon)
          crown(d)
          icon.save(ASSETS / 'icon.png', 'PNG', optimize=True)

          # Android adaptive foreground: transparent and kept inside a conservative safe area.
          adaptive = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          d = ImageDraw.Draw(adaptive)
          crown(d, scale=0.72, ox=143, oy=143)
          adaptive.save(ASSETS / 'adaptive-icon.png', 'PNG', optimize=True)

          # Splash icon: transparent 1024x1024, centered by expo-splash-screen.
          splash = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          d = ImageDraw.Draw(splash)
          crown(d, scale=0.62, ox=195, oy=180)
          splash.save(ASSETS / 'splash.png', 'PNG', optimize=True)

          # Sanity-check actual PNGs and dimensions.
          for name in ('icon.png', 'adaptive-icon.png', 'splash.png'):
              p = ASSETS / name
              with Image.open(p) as im:
                  assert im.format == 'PNG'
                  assert im.size == (1024, 1024)
              assert p.stat().st_size > 1000, (name, p.stat().st_size)

          app_path = Path('app.json')
          data = json.loads(app_path.read_text())
          expo = data['expo']
          expo['icon'] = './assets/icon.png'
          android = expo.setdefault('android', {})
          adaptive_cfg = android.setdefault('adaptiveIcon', {})
          adaptive_cfg['foregroundImage'] = './assets/adaptive-icon.png'
          adaptive_cfg['backgroundColor'] = GREEN

          plugins = expo.setdefault('plugins', [])
          plugins = [p for p in plugins if not (p == 'expo-splash-screen' or (isinstance(p, list) and p and p[0] == 'expo-splash-screen'))]
          plugins.append([
              'expo-splash-screen',
              {
                  'backgroundColor': GREEN,
                  'image': './assets/splash.png',
                  'imageWidth': 220
              }
          ])
          expo['plugins'] = plugins
          app_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

      - name: Validate Expo config
        run: |
          npx expo config --type public >/tmp/expo-config.json
          npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Phaser tests
        run: npm run test:phaser

      - name: Build web
        run: npm run build:web

      - name: Commit repaired mobile assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon.png assets/adaptive-icon.png assets/splash.png app.json package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: replace placeholder mobile app assets"
          git push origin HEAD:fix/mobile-app-assets-bk010
