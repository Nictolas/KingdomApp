name: BK017 Directional Overscan Codemod

on:
  push:
    branches:
      - perf/bk017-directional-overscan

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bk017-directional-overscan
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch app/mappa.tsx
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/mappa.tsx")
          s = p.read_text()

          old_import = "  buildVisibleCellIndices,\n  computeVisibleCellRange,\n  footprintIntersectsRange,"
          new_import = "  buildVisibleCellIndices,\n  computeDirectionalCullingMargins,\n  computeVisibleCellRange,\n  footprintIntersectsRange,\n  MAP_VIEWPORT_MARGIN_CELLS,"
          if new_import not in s:
              if old_import not in s:
                  raise SystemExit("culling import marker not found")
              s = s.replace(old_import, new_import, 1)

          old_initial = '''  const [mapTransform, setMapTransform] = useState<MapTransformState>({\n    positionX: 0,\n    positionY: 0,\n    scale: 1\n  });'''
          new_initial = '''  const [mapTransform, setMapTransform] = useState<MapTransformState>({\n    positionX: 0,\n    positionY: 0,\n    scale: 1,\n    cullingMargins: {\n      left: MAP_VIEWPORT_MARGIN_CELLS,\n      right: MAP_VIEWPORT_MARGIN_CELLS,\n      top: MAP_VIEWPORT_MARGIN_CELLS,\n      bottom: MAP_VIEWPORT_MARGIN_CELLS\n    }\n  });'''
          if new_initial not in s:
              if old_initial not in s:
                  raise SystemExit("mapTransform initial state marker not found")
              s = s.replace(old_initial, new_initial, 1)

          old_setter = '''      setMapTransform((previous) =>\n        shouldCommitMapTransformForCulling(\n          viewportSize.width,\n          viewportSize.height,\n          previous,\n          next,\n          FIXED_MAP_COLS,\n          FIXED_MAP_ROWS,\n          CELL_SIZE_PX\n        )\n          ? next\n          : previous\n      );'''
          new_setter = '''      setMapTransform((previous) => {\n        const nextWithMargins: MapTransformState = {\n          ...next,\n          cullingMargins: computeDirectionalCullingMargins(previous, next)\n        };\n        return shouldCommitMapTransformForCulling(\n          viewportSize.width,\n          viewportSize.height,\n          previous,\n          nextWithMargins,\n          FIXED_MAP_COLS,\n          FIXED_MAP_ROWS,\n          CELL_SIZE_PX\n        )\n          ? nextWithMargins\n          : previous;\n      });'''
          if new_setter not in s:
              if old_setter not in s:
                  raise SystemExit("mapTransform setter marker not found")
              s = s.replace(old_setter, new_setter, 1)

          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mappa.tsx
          git diff --cached --quiet && exit 0
          git commit -m "BK-017: use directional map overscan"
          git push origin HEAD:perf/bk017-directional-overscan
