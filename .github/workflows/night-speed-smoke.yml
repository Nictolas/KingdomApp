name: Night speed feature smoke test

on:
  push:
    branches:
      - feat/automatic-night-speed-home-castle

jobs:
  night-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify night speed logic
        run: npx tsx --test tests/accelerazione-notturna.test.ts
