name: BK-006 map building footprint refactor

on:
  push:
    branches:
      - refactor/map-building-footprints-bk006

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[bk006-map-building-footprints-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow footprint extraction
        run: node scripts/bk006-map-building-footprints.mjs
      - name: Diff sanity
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' app/mappa.tsx src/game/mappaEdificioFootprints.ts tests/mappa-edificio-footprints.test.ts | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Phaser tests
        run: npm run test:phaser
      - name: Build web
        run: npm run build:web
      - name: Commit refactor and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/bk006-map-building-footprints.yml scripts/bk006-map-building-footprints.mjs
          git add -A
          git config user.name "Nictolas"
          git config user.email "nicolasmicheletti90@gmail.com"
          git commit -m "Extract map building footprint helpers" -m "Continue BK-006 by moving footprint dimension and protected-initial-cell helpers out of app/mappa.tsx with regression tests. [bk006-map-building-footprints-applied]"
          git push origin HEAD:refactor/map-building-footprints-bk006
