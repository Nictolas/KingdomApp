name: BK017 Temp Codemod

on:
  push:
    branches:
      - perf/bk017-dedupe-culling-updates

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bk017-dedupe-culling-updates
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch app/mappa.tsx
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/mappa.tsx")
          s = p.read_text()
          old_import = "  footprintIntersectsRange,\n  type MapTransformState"
          new_import = "  footprintIntersectsRange,\n  shouldCommitMapTransformForCulling,\n  type MapTransformState"
          if old_import not in s:
              raise SystemExit("culling import marker not found")
          s = s.replace(old_import, new_import, 1)
          old_block = '''  const scheduleMapTransformUpdate = useCallback((state: MapTransformState) => {\n    pendingTransformRef.current = state;\n    if (transformRafRef.current != null) return;\n    transformRafRef.current = requestAnimationFrame(() => {\n      transformRafRef.current = null;\n      if (pendingTransformRef.current) setMapTransform(pendingTransformRef.current);\n    });\n  }, []);'''
          new_block = '''  const scheduleMapTransformUpdate = useCallback((state: MapTransformState) => {\n    pendingTransformRef.current = state;\n    if (transformRafRef.current != null) return;\n    transformRafRef.current = requestAnimationFrame(() => {\n      transformRafRef.current = null;\n      const next = pendingTransformRef.current;\n      if (!next) return;\n      setMapTransform((previous) =>\n        shouldCommitMapTransformForCulling(\n          viewportSize.width,\n          viewportSize.height,\n          previous,\n          next,\n          FIXED_MAP_COLS,\n          FIXED_MAP_ROWS,\n          CELL_SIZE_PX\n        )\n          ? next\n          : previous\n      );\n    });\n  }, [viewportSize.width, viewportSize.height]);'''
          if old_block not in s:
              raise SystemExit("scheduleMapTransformUpdate block not found")
          s = s.replace(old_block, new_block, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mappa.tsx
          git diff --cached --quiet && exit 0
          git commit -m "BK-017: skip redundant map culling renders"
          git push origin HEAD:perf/bk017-dedupe-culling-updates
